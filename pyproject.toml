[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytomations-data-validation"
version = "0.1.0"
description = "Compare Oracle query results with DAT or CSV exports and create an Excel report."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
data-validation = "data_validation:main"

[project.optional-dependencies]
oracle-dbapi = ["oracledb"]

[tool.setuptools]
packages = ["pytomations_data_validation"]
py-modules = ["data_validation"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
pytomations_data_validation = [".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests", ".agents/tests"]
